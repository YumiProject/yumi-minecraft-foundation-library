[versions]
minecraft = "26.2-rc-1"
fabric-loader = "0.19.3"
neoforge-loader = "11.0.13"
neoforge-api = "26.1.2.71"

# Dependencies
jspecify = "1.0.0"
yumi-commons = "2.0.0"

# Gradle
gradle-licenser = "4.0.+"
gradle-loom = "1.17.+"
gradle-lambdamcdev = "3.0.+"
gradle-nexus-publish = "2.0.0"
gson = "2.11.0"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
neoforge-loader = { module = "net.neoforged.fancymodloader:loader", version.ref = "neoforge-loader" }
neoforge-api = { module = "net.neoforged:neoforge", version.ref = "neoforge-api" }

# Dependencies
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
yumi-commons-core = { module = "dev.yumi.commons:yumi-commons-core", version.ref = "yumi-commons" }
yumi-commons-collections = { module = "dev.yumi.commons:yumi-commons-collections", version.ref = "yumi-commons" }
yumi-commons-event = { module = "dev.yumi.commons:yumi-commons-event", version.ref = "yumi-commons" }

# Gradle
gradle-licenser = { module = "dev.yumi:yumi-gradle-licenser", version.ref = "gradle-licenser" }
gradle-loom = { module = "net.fabricmc:fabric-loom", version.ref = "gradle-loom" }
gradle-lambdamcdev = { module = "dev.lambdaurora.mcdev:dev.lambdaurora.mcdev.gradle.plugin", version.ref = "gradle-lambdamcdev" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Gradle
[plugins]
licenser = { id = "dev.yumi.gradle.licenser", version.ref = "gradle-licenser" }
loom = { id = "fabric-loom", version.ref = "gradle-loom" }
lambdamcdev = { id = "dev.lambdaurora.mcdev", version.ref = "gradle-lambdamcdev" }
nexus-publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "gradle-nexus-publish" }
